apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-worker
  namespace: ticketing
  labels:
    app: booking
    app.kubernetes.io/name: booking-worker
    app.kubernetes.io/part-of: team5-ticket
spec:
  # replicas 명시 안 함 → KEDA ScaledObject가 min~max로 관리.
  # ArgoCD selfHeal이 replicas를 되돌리지 않게 services Application에
  # ignoreDifferences(/spec/replicas) 추가 권장 (PR 설명에 별도 표기).
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-worker
  template:
    metadata:
      labels:
        app: booking
        app.kubernetes.io/name: booking-worker
        app.kubernetes.io/part-of: team5-ticket
    spec:
      serviceAccountName: ticket-service        # SQS IRSA (role annotation은 SA에서 담당자 확정)
      containers:
        - name: booking-worker
          image: ticket-service                 # api와 동일 이미지, 프로파일로 역할 분리
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080               # actuator 메트릭(/actuator/prometheus) 노출용
          envFrom:
            - secretRef:
                name: ticket-app-secret
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev,worker                # worker 프로파일 = @SqsListener 활성
            - name: SPRING_CLOUD_AWS_REGION_STATIC
              value: ap-northeast-2
            # DLQ 적체량 메트릭(booking_sqs_messages{queue="dlq"})용, 큐 이름으로 URL 조회
            - name: AWS_SQS_BOOKING_DLQ_URL
              value: team5-dev-booking-dlq
            # SPRING_DATASOURCE_URL 하드코딩 제거
            #   기존: 옛 계정 RDS 엔드포인트 직접 지정 → envFrom Secret 값(RDS Proxy 경유)을 덮어씀
            #   변경: API와 동일하게 ticket-app-secret(team5/dev/ticket-app) 값 사용
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }