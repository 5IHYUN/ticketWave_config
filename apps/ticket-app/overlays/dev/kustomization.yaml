apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - ../../base

  # worker 워크로드
  - deployment-booking-worker.yaml
  - service-booking-worker.yaml

  # 더미 공연·좌석 생성 (Argo Sync hook, DummyDataInitializer는 공연 존재 시 생략 → 반복 실행 안전)
  #   기존 dev 목록 누락 → 새 계정 RDS에 공연 데이터 없음 → k6 setup 실패
  - db-init-job.yaml

  # Observability / autoscaling manifests added by the observability owner.
  # Keep these resources registered so Prometheus/KEDA settings are not dropped.
  - scaledobject-booking-worker.yaml
  - servicemonitor-booking.yaml
  - hpa.yaml

images:
  - name: ticket-service
    newName: 194722398200.dkr.ecr.ap-northeast-2.amazonaws.com/team5-dev-app
    newTag: dev-9c3258b

patchesStrategicMerge:
  - deployment-patch.yaml
  - gateway-class-patch.yaml
