apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticket-service-hpa
  namespace: ticketing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticket-service
  minReplicas: 1
  maxReplicas: 3   # DB 연결 예산 (Worker 3 + API 3) x 8 = 48, 시나리오 1 용량 정합성 조정
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 50 → 70 (analysis/12, deployment-patch.yaml의 CPU request·limit 변경과 묶은 1건의 조정)
          #   기존: request 300m × 50% = 150m → JVM 기동·워밍업 CPU만으로 최대치까지 확장
          #   변경: request 500m × 70% = 350m → 순간 워밍업 CPU에 덜 반응, 실제 부하 기준 확장
          averageUtilization: 70
  # 스케일 거동 정책 (flapping 방지). 팀원 PR의 behavior 블록 흡수.
  behavior:
    # 급증: 60초 관찰 후 빠르게 확장 (최대 100%↑ 또는 +4 Pod/분 중 큰 쪽)
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    # 축소: 5분 관찰 후 천천히 (분당 최대 50%만 줄임 = 갑자기 다 내려가는 거 방지)
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min