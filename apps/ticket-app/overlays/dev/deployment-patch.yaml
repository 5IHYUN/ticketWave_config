# dev 환경용 override (env는 name 기준 merge)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: ticketing
spec:
  template:
    spec:
      containers:
        - name: ticket-service
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: QUEUE_TOKEN_BYPASS
              value: "false"
            - name: AWS_S3_POSTER_BUCKET
              value: ticketwave-dev-poster-5ihyun   # infra envs/dev/infra/s3.tf 버킷 이름과 일치 (옛 팀 버킷 이름 충돌 방지)
