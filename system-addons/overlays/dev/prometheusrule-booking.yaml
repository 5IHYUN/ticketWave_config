# =====================================================================
# booking 도메인 SLO / 알림 규칙  (dev)
# 파일명 변경: kube-prometheus-stack.yaml → prometheusrule-booking.yaml
#   (차트 설치는 kube-prometheus-stack-app.yaml, 이 파일은 규칙만 정의)
# ---------------------------------------------------------------------
# 설계 원칙 (멘토 피드백 반영):
#   - 절대값 임계("p99 > 5s") 가 아니라 "위반 빈도 + 에러버짓" 기반.
#   - SLI 판정은 1분 윈도우 단위(good=0 / bad=1)로 기록 -> 30일 누적이 곧 예산 소비량.
#   - latency/freshness 는 윈도우 기반 SLO, 가용성(성공률)은 이벤트 기반 비율 SLO.
#     (성격이 다르므로 형태도 다르게 둠.)
#
# SLI 2종:
#   (동기)  좌석 선점 p99 지연      threshold 300ms   target 99.5% good windows  (2026-10-06 확정, 잠정)
#   (비동기) 큐 나이(oldest msg)    threshold  60s    target  99%  good windows
#   * e2e p99 는 SLO 에서 제외(트레이싱 붙은 뒤 진단용 ground truth 로만 사용).
#   * conflict(409, 동시성 정상 거절)는 어떤 분모에도 넣지 않음.
#
# ⚠️ target(허용 bad 비율)과 threshold 는 "잠정값"이다.
#    baseline / 부하테스트 시나리오2 측정 후 반드시 튜닝할 것.
#    (자=측정 메커니즘은 지금 박고, 목표 숫자 N 은 데이터로 확정)
#
# ⚠️ repo 에 있다 != 클러스터에 떠있다.
#    - ArgoCD targetRevision=main 이므로 main 머지 후 sync됨.
#    - apply 후 Prometheus UI 에서 각 record 시계열이 실제로 값이 찍히는지
#      (No data / 0 고정 아닌지) 반드시 확인. (과거 'confiremd' 오타 교훈)
# =====================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: booking-slo
  namespace: ticketing
  annotations:
    # PrometheusRule CRD는 kube-prometheus-stack 설치 후 생성 → 첫 sync dry-run 실패 방지
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    # =================================================================
    # [그룹 1] SLI 판정 — 1분 윈도우. interval:1m 이라 1샘플=1윈도우.
    #   이 그룹의 record 가 30일 누적/burn-rate 의 원재료가 된다.
    # =================================================================
    - name: booking.sli
      interval: 1m
      rules:
        # ---- (동기) 좌석 선점 p99 지연 ----
        # uri 정확매칭 + method=POST 격리. (라이브 라벨 확정: uri="/api/v1/seats/{seatId}/hold")
        #   기존 prefix 정규식 /api/v1/seats.* 은 같은 path 의 DELETE(release) 까지 흡수해
        #   p99 를 오염시켰음 -> NaN/오발(FastBurn) 원인. 정확매칭으로 격리.
        # 무트래픽 분(分)에는 시계열 자체가 없음 -> bad_window 에 gap.
        #   gap = "그 분엔 요청이 없어 위반 판정 불가" 로 처리(예산 분모에서도 제외됨). 의도된 동작.
        - record: booking:seathold_latency_p99_seconds
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(http_server_requests_seconds_bucket{uri="/api/v1/seats/{seatId}/hold", method="POST"}[2m])))

        # bad=1 / good=0. threshold 300ms (3-2 재산정, analysis/10)
        #   AWS baseline: warm Pod hold p95 93ms / 스케일아웃 콜드 스타트 p95 148~193ms, max 881ms
        #   기존 0.7(700ms)는 완전 콜드 구간만 감지, 2·3회차 악화 미감지 → 정상 p95의 약 3배인 300ms
        #   잠정값: 2일차 발화 횟수 기록 후 조정
        - record: booking:seathold_latency:bad_window
          expr: booking:seathold_latency_p99_seconds > bool 0.3

        # ---- (비동기) 큐 나이 = 가장 오래 대기 중인 메시지 나이(초) ----
        # YACE 가 ApproximateAgeOfOldestMessage(Maximum) 를 이미 수집 중.
        # 게이지라 항상 존재(큐 비면 0). count 가 아니라 'age' 가 우리 SLI.
        # 큐 이름 .fifo 여부 대응: regex(=~)로 .fifo 유무 양쪽 매칭
        #   (기존: 주석은 regex, 실제 식은 정확 매칭 → FIFO 전환 시 No data로 알림 영구 미발생, analysis/05 #2)
        #   현재 Terraform dev는 표준 큐(fifo_queue=false)
        - record: booking:queue_age_seconds:max
          expr: |
            max(aws_sqs_approximate_age_of_oldest_message_maximum{dimension_QueueName=~"team5-dev-booking-queue(\\.fifo)?"})

        # bad=1 / good=0. threshold 60s.
        # (KEDA pollingInterval 15s + cooldown 120s 반응 lag 흡수 위해 60s. 시나리오2로 30s 조이기 검토)
        - record: booking:queue_age:bad_window
          expr: booking:queue_age_seconds:max > bool 60

    # =================================================================
    # [그룹 2] 에러버짓 — 30일 누적. 무거운 30d 쿼리라 interval:5m.
    #   consumed = bad 분 수, observed = 관측된 분 수(무트래픽 제외).
    #   budget_remaining_ratio = 1 - (consumed / (observed * 허용bad비율))
    #     1.0  = 예산 100% 남음 / 0.0 = 예산 소진 / 음수 = SLO 위반(초과 소비)
    # =================================================================
    - name: booking.slo_budget
      interval: 5m
      rules:
        # ---- (동기) target 99.5% -> 허용 bad 비율 0.005  (≈ 30일 216분) ----
        - record: booking:seathold_latency:bad_windows_30d
          expr: sum_over_time(booking:seathold_latency:bad_window[30d])
        - record: booking:seathold_latency:observed_windows_30d
          expr: count_over_time(booking:seathold_latency:bad_window[30d])
        - record: booking:seathold_latency:budget_remaining_ratio
          # ⚠️ 0.005 = 허용 bad 비율(잠정, target 99.5%). 측정 후 튜닝.
          expr: |
            1 - (
              booking:seathold_latency:bad_windows_30d
              /
              (booking:seathold_latency:observed_windows_30d * 0.005)
            )

        # ---- (비동기) target 99% -> 허용 bad 비율 0.01  (≈ 30일 432분) ----
        # 비동기는 스파이크/오토스케일 lag 때문에 동기보다 느슨하게 시작.
        - record: booking:queue_age:bad_windows_30d
          expr: sum_over_time(booking:queue_age:bad_window[30d])
        - record: booking:queue_age:observed_windows_30d
          expr: count_over_time(booking:queue_age:bad_window[30d])
        - record: booking:queue_age:budget_remaining_ratio
          # ⚠️ 0.01 = 허용 bad 비율(잠정, target 99%). 측정 후 튜닝.
          expr: |
            1 - (
              booking:queue_age:bad_windows_30d
              /
              (booking:queue_age:observed_windows_30d * 0.01)
            )

    # =================================================================
    # [그룹 3] 알림
    #   - SLO 위반: multi-window burn-rate (fast=page / slow=ticket).
    #     burn rate = 최근 bad 비율 / 허용 bad 비율.
    #     fast 14.4배(1h&5m) -> ~2일이면 30일 예산 소진 = 즉시 대응.
    #     slow  6배 (6h&30m) -> 며칠 내 소진 = 추적.
    #   - 가용성(성공률)은 이벤트 기반 비율 SLO 그대로 유지.
    #   - 큐 적체(count)는 SLO 아님. KEDA 따라가는지 보는 운영 지표.
    # =================================================================
    - name: booking.alerts
      rules:
        # ---- (동기) 좌석 선점 p99 SLO burn-rate ----
        - alert: SeatHoldLatencyFastBurn
          expr: |
            avg_over_time(booking:seathold_latency:bad_window[1h]) > (14.4 * 0.005)
            and
            avg_over_time(booking:seathold_latency:bad_window[5m]) > (14.4 * 0.005)
          for: 2m
          labels:
            severity: critical
            team: team5
            slo: seat-hold-latency
          annotations:
            summary: "좌석 선점 p99 SLO 예산 빠른 소진 (fast burn)"
            description: "최근 1h bad-window 비율 {{ $value | humanizePercentage }} — 목표 0.5%의 14.4배 초과. 이 속도면 ~2일에 30일 예산 소진."

        - alert: SeatHoldLatencySlowBurn
          expr: |
            avg_over_time(booking:seathold_latency:bad_window[6h]) > (6 * 0.005)
            and
            avg_over_time(booking:seathold_latency:bad_window[30m]) > (6 * 0.005)
          for: 15m
          labels:
            severity: warning
            team: team5
            slo: seat-hold-latency
          annotations:
            summary: "좌석 선점 p99 SLO 예산 소진 추세 (slow burn)"
            description: "최근 6h bad-window 비율 {{ $value | humanizePercentage }} — 목표 0.5%의 6배 초과."

        # ---- (비동기) 큐 나이 SLO burn-rate ----
        - alert: QueueAgeFastBurn
          expr: |
            avg_over_time(booking:queue_age:bad_window[1h]) > (14.4 * 0.01)
            and
            avg_over_time(booking:queue_age:bad_window[5m]) > (14.4 * 0.01)
          for: 2m
          labels:
            severity: critical
            team: team5
            slo: queue-age
          annotations:
            summary: "큐 나이 SLO 예산 빠른 소진 (fast burn)"
            description: "최근 1h 큐 나이 60s 초과 윈도우 비율 {{ $value | humanizePercentage }} — 워커/노드 프로비저닝이 못 따라가는 신호."

        - alert: QueueAgeSlowBurn
          expr: |
            avg_over_time(booking:queue_age:bad_window[6h]) > (6 * 0.01)
            and
            avg_over_time(booking:queue_age:bad_window[30m]) > (6 * 0.01)
          for: 15m
          labels:
            severity: warning
            team: team5
            slo: queue-age
          annotations:
            summary: "큐 나이 SLO 예산 소진 추세 (slow burn)"
            description: "최근 6h 큐 나이 60s 초과 윈도우 비율 {{ $value | humanizePercentage }}."

        # ---- (비동기) 예매 확정 성공률 SLO 99% — 이벤트 기반(유지) ----
        # conflict(동시성 정상 거절)는 분모에서 제외: confirmed/(confirmed+failed).
        - alert: BookingConfirmSuccessSLOBreach
          expr: |
            (
              sum(rate(booking_confirm_total{result="confirmed"}[5m]))
              /
              sum(rate(booking_confirm_total{result=~"confirmed|failed"}[5m]))
            ) < 0.99
          for: 5m
          labels:
            severity: critical
            team: team5
            slo: booking-availability
          annotations:
            summary: "예매 확정 성공률 SLO(99%) 위반"
            description: "현재 성공률 {{ $value | humanizePercentage }} (conflict 제외)."

        # ---- (동기) 5xx 오류율 가드 (유지) ----
        # 409 좌석 충돌은 4xx라 여기 안 잡힘 = 의도된 동시성 거절은 정상.
        - alert: BookingHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m])) > 0.05
          for: 2m
          labels:
            severity: warning
            team: team5
          annotations:
            summary: "booking 5xx 오류율 5% 초과"
            description: "현재 오류율 {{ $value | humanizePercentage }}."

        # ---- 큐 적체(count) — SLO 아님. KEDA 헬스/포화 지표(유지) ----
        # SLO 는 위의 '큐 나이'. 이건 KEDA 가 backlog 를 따라잡고 있는지 보는 운영 신호.
        - alert: BookingQueueBacklogHigh
          expr: |
            max(aws_sqs_approximate_number_of_messages_visible_maximum{dimension_QueueName=~"team5-dev-booking-queue(\\.fifo)?"}) > 500
          for: 3m
          labels:
            severity: warning
            team: team5
          annotations:
            summary: "booking-queue 적체 500 초과 (KEDA 추적 지표, SLO 아님)"
            description: "현재 적체 {{ $value }}건 — KEDA 스케일/노드 프로비저닝이 못 따라가는지 확인."

    # =================================================================
    # [그룹 4] 증상·원인 알림 — 장애 시나리오 검증용 짧은 윈도우 (3-2·3-4, analysis/10)
    #   - 위 burn-rate(1h/6h, 30일 버짓)는 검증일에만 켜는 dev에서 발화 확인 불가 → 별도 구성, 버짓 규칙은 유지
    #   - category: symptom(사용자 영향) / cause(원인 후보). 원인 알림 단독으로는 사용자 영향 미확정
    #   - 큐 관련 지표는 앱 게이지·히스토그램 사용 (YACE는 CloudWatch 경유 1~5분 지연)
    #   - 메시지 표준 annotations
    #       summary      한 줄 요약
    #       description  현재 값
    #       impact       사용자 영향 범위
    #       runbook_url  대응 절차
    #       dashboard    확인할 대시보드 (Grafana port-forward 기준)
    #       logql        먼저 볼 로그 쿼리
    #   - threshold: provisional 라벨 = 시나리오 결과로 재조정 대상
    # =================================================================
    - name: booking.symptoms
      rules:
        # ---- 좌석 선점 지연 (증상) ----
        # 기록 규칙 booking:seathold_latency_p99_seconds 재사용 (1분 평가)
        # 2일차: 발화 횟수·시점 기록 후 300ms·3m 조정
        - alert: SeatHoldLatencyHigh
          expr: booking:seathold_latency_p99_seconds > 0.3
          for: 3m
          labels:
            severity: warning
            team: team5
            category: symptom
            threshold: provisional
          annotations:
            summary: "좌석 선점 p99 300ms 초과 (3분 지속)"
            description: "현재 좌석 선점 p99 {{ $value | humanizeDuration }}"
            impact: "좌석 선택 직후 응답 지연, 선점 실패 체감 가능"
            runbook_url: "https://github.com/5IHYUN/ticketWave_config/blob/main/docs/runbooks/seat-hold-latency.md"
            dashboard: "http://localhost:3000/d/booking-pipeline"
            logql: '{namespace="ticketing"} | json | event="http.request" | path=~"/api/v1/seats/.*/hold"'

        # ---- Worker 처리 지연: 큐 대기 (증상) ----
        # 주의: queue_wait는 Worker가 메시지를 "수신"할 때만 기록
        #   → Worker가 완전히 멈추면 새 샘플 없음 → 값 없음(NaN)으로 이 알림은 안 울림
        #   → 아래 BookingBacklogGrowing(적체 게이지)이 그 경우를 담당
        - alert: BookingQueueWaitHigh
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(booking_queue_wait_seconds_bucket{namespace="ticketing"}[2m]))) > 5
          for: 2m
          labels:
            severity: critical
            team: team5
            category: symptom
            scenario: worker-delay
          annotations:
            summary: "예약 큐 대기 p95 5초 초과 (2분 지속)"
            description: "현재 큐 대기 p95 {{ $value | humanizeDuration }} (메시지 생성 → Worker 수신)"
            impact: "예약 결과(확정) 응답 지연, 결과 폴링 증가"
            runbook_url: "https://github.com/5IHYUN/ticketWave_config/blob/main/docs/runbooks/worker-delay.md"
            dashboard: "http://localhost:3000/d/booking-pipeline"
            logql: '{namespace="ticketing"} | json | event="worker.received" | queueWaitMs > 5000'

        # ---- 큐 적체 (원인 후보) ----
        # 앱 게이지(2초 조회). Worker Pod마다 같은 큐 값을 노출 → max 집계 (sum 시 Pod 수 배수)
        - alert: BookingBacklogGrowing
          expr: max(booking_sqs_messages{namespace="ticketing", queue="main", state="visible"}) > 100
          for: 2m
          labels:
            severity: warning
            team: team5
            category: cause
            scenario: worker-delay
          annotations:
            summary: "booking-queue 대기 메시지 100건 초과 (2분 지속)"
            description: "현재 대기 {{ $value }}건 — Worker 처리량 < 유입량"
            impact: "적체가 이어지면 큐 대기·확정 지연으로 확대"
            runbook_url: "https://github.com/5IHYUN/ticketWave_config/blob/main/docs/runbooks/worker-delay.md"
            dashboard: "http://localhost:3000/d/booking-pipeline"
            logql: '{namespace="ticketing"} | json | event="worker.processed" | processMs > 500'

        # ---- DLQ 유입 (원인) ----
        # 5회 처리 실패 메시지 = 예약 요청 유실 후보. 정상 상태에서 0
        - alert: BookingDlqNotEmpty
          expr: max(booking_sqs_messages{namespace="ticketing", queue="dlq", state="visible"}) > 0
          for: 1m
          labels:
            severity: critical
            team: team5
            category: cause
          annotations:
            summary: "booking DLQ 메시지 발생"
            description: "DLQ 대기 {{ $value }}건 — Worker 반복 처리 실패"
            impact: "해당 예약 요청 미처리 (사용자는 결과 PROCESSING 유지)"
            runbook_url: "https://github.com/5IHYUN/ticketWave_config/blob/main/docs/runbooks/worker-delay.md"
            dashboard: "http://localhost:3000/d/booking-pipeline"
            logql: '{namespace="ticketing", level="ERROR"} | json'

        # ---- DB 커넥션 대기 (원인) ----
        # AWS baseline: pending 전 구간 0 → 0 초과 자체가 이상 신호
        # 잠정값: 시나리오 2(DB 풀 고갈) 결과로 기준(> 0 / for 1m) 재판단
        - alert: DbConnectionPending
          # pod(클러스터)·instance(로컬 compose) 라벨 모두 유지 → 어느 환경이든 대상 식별 (로컬 검증 시 pod 공란 발견)
          expr: max by (pod, instance) (hikaricp_connections_pending{namespace="ticketing"}) > 0
          for: 1m
          labels:
            severity: warning
            team: team5
            category: cause
            scenario: db-pool
            threshold: provisional
          annotations:
            summary: "DB 커넥션 대기 발생 ({{ if $labels.pod }}{{ $labels.pod }}{{ else }}{{ $labels.instance }}{{ end }})"
            description: "커넥션 대기 스레드 {{ $value }}개 (1분 지속)"
            impact: "해당 Pod의 DB 사용 요청 지연, 지속 시 타임아웃 오류"
            runbook_url: "https://github.com/5IHYUN/ticketWave_config/blob/main/docs/runbooks/db-pool-exhaustion.md"
            dashboard: "http://localhost:3000/d/booking-pipeline"
            logql: '{namespace="ticketing"} | json | message=~".*Connection is not available.*"'

        # ---- Worker DB 처리 지연 (증상) ----
        # booking_worker_process_seconds = 커넥션 획득 대기 포함 → 풀 고갈 시 함께 상승
        - alert: WorkerProcessSlow
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(booking_worker_process_seconds_bucket{namespace="ticketing"}[2m]))) > 0.5
          for: 2m
          labels:
            severity: warning
            team: team5
            category: symptom
            scenario: db-pool
          annotations:
            summary: "Worker 예약 처리 p95 500ms 초과 (2분 지속)"
            description: "현재 처리 p95 {{ $value | humanizeDuration }}"
            impact: "예약 확정 지연, 지속 시 큐 적체로 확대"
            runbook_url: "https://github.com/5IHYUN/ticketWave_config/blob/main/docs/runbooks/db-pool-exhaustion.md"
            dashboard: "http://localhost:3000/d/booking-pipeline"
            logql: '{namespace="ticketing"} | json | event="worker.processed" | processMs > 500'
