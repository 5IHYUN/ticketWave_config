# system-addons/overlays/dev/kube-prometheus-stack-app.yaml
# Prometheus Operator 본체(kube-prometheus-stack chart) ArgoCD Application (dev)
#
# 기존 dev overlay에 차트 Application 누락 (prod에만 복구본 존재)
#   → dev에서 Prometheus Operator 미설치 → PrometheusRule·ServiceMonitor CRD 없음
#   → system-addons-dev / ticket-app Application sync 실패 원인
# prod 복구본 기준, dev 운영 방식(검증일에만 생성·삭제)에 맞춰 조정
#   - 저장소: PVC 없음 (emptyDir). 클러스터 삭제 시 PVC 정리 누락 → EBS 잔존 비용 방지
#     실험 데이터는 캡처·export로 보존
#   - Grafana Ingress 없음 → kubectl port-forward 접속 (ALB 비용·외부 노출 제거)
#   - Watchdog·InfoInhibitor는 null 수신자로 라우팅 (상시 발화 알림의 Slack 노이즈 제거)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 61.7.2            # prod와 동일 버전
    helm:
      values: |
        # EKS 관리형 control plane 메트릭 미노출 → 해당 기본 알림은 항상 오탐, 비활성
        defaultRules:
          create: true
          rules:
            kubeSchedulerAlerting: false
            kubeControllerManager: false
            etcd: false
            kubeProxy: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        grafana:
          enabled: true
          persistence:
            enabled: false
          # 대시보드: infra/monitoring ConfigMap(grafana_dashboard="1")을 사이드카가 자동 임포트
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
          # Loki 데이터소스 (uid 고정 → 로컬 Grafana와 같은 uid, 대시보드 JSON 공용)
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
          # Grafana 자체 메트릭 ServiceMonitor: 차트 기본 scrapeTimeout 30s > 전역 scrapeInterval 15s
          #   → Prometheus Operator가 거부 → PrometheusOperatorRejectedResources 상시 발화 (2026-10-08 확인)
          serviceMonitor:
            scrapeTimeout: 10s
          # 접속: kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80
          # admin 비밀번호: kubectl -n monitoring get secret kube-prometheus-stack-grafana -o jsonpath='{.data.admin-password}' | base64 -d

        prometheus:
          prometheusSpec:
            retention: 2d               # 검증일 단위 사용, 장기 보존 불필요
            scrapeInterval: 15s
            evaluationInterval: 15s
            resources:
              requests:
                cpu: 200m
                memory: 768Mi
              limits:
                memory: 1536Mi
            # 모든 네임스페이스의 ServiceMonitor·PrometheusRule 자동 발견 (ticketing ns 포함)
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false

        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-slack      # alertmanager-slack-externalsecret.yaml
          # 알림 메시지 템플릿 (2026-10-08 노이즈 조정)
          #   - 묶음 메시지 안에서 증상 → 원인 후보 → 기타 순으로 정렬, 해제된 알림은 이름만 한 줄
          #   - 차트가 /etc/alertmanager/config/ 에 마운트 → 아래 config.templates 경로로 로드
          templateFiles:
            team5.tmpl: |-
              {{ define "team5.alert" }}*{{ .Annotations.summary }}*{{ if .Annotations.description }}
              {{ .Annotations.description }}{{ end }}{{ if .Annotations.impact }}
              • 영향: {{ .Annotations.impact }}{{ end }}{{ if .Labels.category }}
              • 구분: {{ .Labels.category }}{{ if .Labels.scenario }} / {{ .Labels.scenario }}{{ end }}{{ end }}{{ if .Annotations.runbook_url }}
              • 런북: {{ .Annotations.runbook_url }}{{ end }}{{ if .Annotations.dashboard }}
              • 대시보드: {{ .Annotations.dashboard }}{{ end }}{{ if .Annotations.logql }}
              • 로그: `{{ .Annotations.logql }}`{{ end }}
              {{ end }}
              {{ define "team5.title" }}[DEV][{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ if .CommonLabels.alertname }}{{ .CommonLabels.alertname }}{{ else }}{{ range $i, $a := .Alerts.Firing }}{{ if $i }}, {{ end }}{{ $a.Labels.alertname }}{{ end }}{{ end }}{{ end }}
              {{ define "team5.text" }}{{ range .Alerts.Firing }}{{ if eq .Labels.category "symptom" }}[증상] {{ template "team5.alert" . }}
              {{ end }}{{ end }}{{ range .Alerts.Firing }}{{ if eq .Labels.category "cause" }}[원인 후보] {{ template "team5.alert" . }}
              {{ end }}{{ end }}{{ range .Alerts.Firing }}{{ if not .Labels.category }}{{ template "team5.alert" . }}
              {{ end }}{{ end }}{{ if .Alerts.Resolved }}해제: {{ range $i, $a := .Alerts.Resolved }}{{ if $i }}, {{ end }}{{ $a.Labels.alertname }}{{ end }}{{ end }}{{ end }}
          # 알림 메시지 표준 (3-4): summary·description + 영향·구분·런북·대시보드·로그 쿼리
          #   annotations 없는 기본 규칙(kube-prometheus 기본 알림)은 해당 줄 생략
          config:
            templates:
              - /etc/alertmanager/config/*.tmpl
            route:
              receiver: slack-default
              group_by: ["alertname", "severity"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                # 상시 발화(파이프라인 생존 확인용) 알림 → Slack 미전송
                - matchers:
                    - alertname =~ "Watchdog|InfoInhibitor"
                  receiver: "null"
                # 예약 서비스 알림 묶음 (2026-10-08 노이즈 조정)
                #   근거: 같은 장애에서 알림 이름마다 별도 메시지 → 시나리오 1 약 2분 사이 9종, 2b 11종 동시 발화
                #   team·severity 단위로 묶어 한 장애 = 채널별 한 메시지 + 변경 시 갱신
                #   group_wait 1m: 첫 알림 뒤 연쇄 발화를 모아 보냄 (탐지 알림 최대 30초 추가 지연 감수)
                - matchers:
                    - team = "team5"
                  group_by: ["team", "severity"]
                  group_wait: 1m
                  routes:
                    - matchers:
                        - severity = "critical"
                      receiver: slack-critical
                - matchers:
                    - severity = "critical"
                  receiver: slack-critical
            # 억제 규칙: 앞 4개는 차트 기본값 (목록은 덮어쓰기라 유지 위해 명시)
            inhibit_rules:
              - source_matchers: ['severity = "critical"']
                target_matchers: ['severity =~ "warning|info"']
                equal: ["namespace", "alertname"]
              - source_matchers: ['severity = "warning"']
                target_matchers: ['severity = "info"']
                equal: ["namespace", "alertname"]
              - source_matchers: ['alertname = "InfoInhibitor"']
                target_matchers: ['severity = "info"']
                equal: ["namespace"]
              - target_matchers: ['alertname = "InfoInhibitor"']
              # 같은 시나리오(같은 런북) 안에서 critical이 울리면 warning 억제
              #   예: BookingQueueWaitHigh(critical) → BookingBacklogGrowing(warning)
              #   scenario 라벨 없는 알림끼리는 비교하지 않음 (빈 값끼리 같다고 판단되는 것 방지)
              - source_matchers: ['team = "team5"', 'severity = "critical"', 'scenario =~ ".+"']
                target_matchers: ['team = "team5"', 'severity = "warning"', 'scenario =~ ".+"']
                equal: ["scenario"]
              # 같은 SLI(좌석 선점 지연): fast burn(critical)이 울리면 p99 임계·slow burn 억제
              - source_matchers: ['alertname = "SeatHoldLatencyFastBurn"']
                target_matchers: ['alertname =~ "SeatHoldLatencyHigh|SeatHoldLatencySlowBurn"']
                equal: ["team"]
              # 같은 원인(KEDA external metrics API): Down이 울리면 Errors 억제
              - source_matchers: ['alertname = "KubeAggregatedAPIDown"']
                target_matchers: ['alertname = "KubeAggregatedAPIErrors"']
                equal: ["name"]
              # 하지 않은 것: 원인 알림(DbConnectionPending 등)으로 다른 시나리오 증상 억제
              #   시나리오 1(Worker 지연)에서도 ticket-service DbConnectionPending이 함께 울림 → 진짜 장애를 가릴 위험
            receivers:
              - name: "null"
              - name: slack-default
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
                    send_resolved: true
                    title: '{{ template "team5.title" . }}'
                    text: '{{ template "team5.text" . }}'
              - name: slack-critical
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url-critical
                    send_resolved: true
                    title: '{{ template "team5.title" . }}'
                    text: '{{ template "team5.text" . }}'

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true            # 대용량 CRD 처리
