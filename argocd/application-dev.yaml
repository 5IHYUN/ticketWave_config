apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticket-app-dev
  namespace: argocd
spec:
  project: team5-project
  source:
    repoURL: https://github.com/5IHYUN/ticketWave_config.git
    targetRevision: main
    path: apps/ticket-app/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketing
  # 오토스케일러가 관리하는 replicas는 ArgoCD drift 검사에서 제외 (selfHeal 충돌 방지)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: booking-worker      # KEDA(SQS 적체)가 replicas 관리
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: ticket-service      # HPA(CPU)가 replicas 관리
      jsonPointers:
        - /spec/replicas
    - group: gateway.networking.k8s.io
      kind: GatewayClass
      name: alb
      jsonPointers:
        - /spec/controllerName
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      # CRD(External Secrets·Gateway API·KEDA·Prometheus 등)가 같은 sync에서 설치되기 전
      # 이를 사용하는 리소스의 dry-run 실패로 전체 sync가 막히는 문제 방지 (빈 클러스터 최초 배포)
      - SkipDryRunOnMissingResource=true
    # 자동 sync는 같은 커밋에서 실패하면 재시도하지 않음 → CRD 설치 대기 동안 재시도
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
